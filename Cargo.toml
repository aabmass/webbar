[package]
name = "webbar"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
gtk4 = "0.10"
gtk4-layer-shell = "0.7"
webkit6 = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
zbus = { version = "5.0", default-features = false, features = [
    "async-io",
    "blocking-api",
] }
async-io = "2"
base64 = "0.22"
futures-channel = "0.3"
futures-util = "0.3"
