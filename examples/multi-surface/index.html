<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>webbar multi-surface demo</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body,
      #app {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: transparent;
        color: #ececf1;
        font-family: "Inter", system-ui, -apple-system, sans-serif;
        font-size: 13px;
        font-weight: 500;
        user-select: none;
        overflow: hidden;
      }
      .bar {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: var(--webbar-height, 38px);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 14px;
        background: rgba(24, 24, 28, 0.94);
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      }
      .bar-title {
        display: flex;
        align-items: center;
        gap: 8px;
        font-weight: 700;
        color: #ececf1;
      }
      .pill {
        font-size: 11px;
        font-weight: 600;
        padding: 2px 8px;
        border-radius: 999px;
        background: rgba(138, 180, 248, 0.18);
        color: #8ab4f8;
      }
      .bar-actions {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .dock-wrap {
        position: fixed;
        top: auto;
        left: 0;
        right: 0;
        bottom: 0;
        height: var(--webbar-height, 52px);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        padding: 0 16px;
        background: rgba(24, 24, 28, 0.94);
        border-top: 1px solid rgba(255, 255, 255, 0.1);
      }
      .dock-label {
        color: #9a9aa6;
        font-size: 12px;
        margin-right: 4px;
      }
      .launcher {
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        gap: 12px;
        padding: 18px;
        border-radius: 14px;
        background: #1c1c21;
        border: 1px solid rgba(138, 180, 248, 0.45);
        box-shadow: 0 18px 48px rgba(0, 0, 0, 0.65);
      }
      .launcher-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .launcher-head strong {
        font-size: 14px;
        color: #ececf1;
      }
      .launcher-hint {
        font-size: 11px;
        color: #9a9aa6;
      }
      .launcher input {
        width: 100%;
        padding: 10px 12px;
        border-radius: 8px;
        border: 1px solid rgba(138, 180, 248, 0.5);
        background: #26262c;
        color: #ececf1;
        font: inherit;
        outline: none;
      }
      .launcher-list {
        display: flex;
        flex-direction: column;
        gap: 6px;
        flex: 1;
      }
      .launcher-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 8px 12px;
        border-radius: 8px;
        background: #26262c;
        color: #ececf1;
      }
      .launcher-item.is-selected {
        background: rgba(138, 180, 248, 0.2);
        border: 1px solid rgba(138, 180, 248, 0.45);
      }
      .launcher-item span {
        font-size: 11px;
        color: #9a9aa6;
      }
      button {
        padding: 5px 12px;
        border-radius: 8px;
        border: 1px solid rgba(255, 255, 255, 0.14);
        background: #26262c;
        color: #ececf1;
        font: inherit;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
      }
      button.primary {
        background: #8ab4f8;
        color: #0e1420;
        border-color: transparent;
      }
      button:hover {
        filter: brightness(1.1);
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script>
      const root = document.getElementById("app");
      const surface = window.webbar?.surface || "bar";
      const channel = new BroadcastChannel("webbar-multi-surface-demo");

      if (surface === "bar") {
        root.innerHTML = `
          <header class="bar">
            <div class="bar-title">
              <span>webbar</span>
              <span class="pill">surface: bar · edge: top · 38px</span>
            </div>
            <div class="bar-actions">
              <button id="toggle-dock">Toggle Dock</button>
              <button id="toggle-launcher" class="primary">Launcher</button>
            </div>
          </header>
        `;
        document.getElementById("toggle-dock").onclick = () =>
          window.webbar.surfaces.toggle("dock");
        document.getElementById("toggle-launcher").onclick = () =>
          window.webbar.surfaces.toggle("launcher");
      } else if (surface === "dock") {
        root.innerHTML = `
          <footer class="dock-wrap">
            <span class="dock-label">surface: dock · edge: bottom · 52px</span>
            <button>Terminal</button>
            <button>Browser</button>
            <button>Files</button>
            <button id="dock-launcher" class="primary">Launcher</button>
            <span id="dock-ping" class="dock-label"></span>
          </footer>
        `;
        document.getElementById("dock-launcher").onclick = () =>
          window.webbar.surfaces.toggle("launcher");
        channel.onmessage = (ev) => {
          document.getElementById("dock-ping").textContent = String(ev.data);
        };
      } else if (surface === "launcher") {
        root.innerHTML = `
          <main class="launcher">
            <div class="launcher-head">
              <strong>Overlay Launcher</strong>
              <span class="launcher-hint">layer: overlay · keyboard: exclusive · Esc to close</span>
            </div>
            <input id="launcher-input" placeholder="Search applications or commands…" autofocus />
            <div class="launcher-list">
              <div class="launcher-item is-selected"><strong>Terminal (foot)</strong><span>Wayland terminal</span></div>
              <div class="launcher-item"><strong>Firefox</strong><span>Web browser</span></div>
              <div class="launcher-item"><strong>System Settings</strong><span>Audio, Bluetooth, Display</span></div>
            </div>
          </main>
        `;
        const input = document.getElementById("launcher-input");
        input.addEventListener("input", () => {
          channel.postMessage(input.value ? `Launcher: ${input.value}` : "");
        });
        window.addEventListener("keydown", (e) => {
          if (e.key === "Escape") {
            window.webbar.surfaces.hide("launcher");
          }
        });
      }
    </script>
  </body>
</html>
