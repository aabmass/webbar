<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e4e9f5"/>
      <stop offset="50%" stop-color="#edf0f7"/>
      <stop offset="100%" stop-color="#e3ebf4"/>
    </linearGradient>

    <radialGradient id="glowBlue" cx="20%" cy="18%" r="55%">
      <stop offset="0%" stop-color="#2b6de0" stop-opacity="0.18"/>
      <stop offset="48%" stop-color="#7aa2f7" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#edf0f7" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowMint" cx="82%" cy="78%" r="52%">
      <stop offset="0%" stop-color="#1f8f54" stop-opacity="0.13"/>
      <stop offset="50%" stop-color="#6fcf97" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#edf0f7" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowPeach" cx="65%" cy="22%" r="44%">
      <stop offset="0%" stop-color="#8b6fe0" stop-opacity="0.12"/>
      <stop offset="55%" stop-color="#b4a0f0" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#edf0f7" stop-opacity="0"/>
