<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0d14"/>
      <stop offset="48%" stop-color="#111522"/>
      <stop offset="100%" stop-color="#0c101a"/>
    </linearGradient>

    <radialGradient id="glowBlue" cx="22%" cy="18%" r="55%">
      <stop offset="0%" stop-color="#8ab4f8" stop-opacity="0.28"/>
      <stop offset="45%" stop-color="#3b6fd8" stop-opacity="0.11"/>
      <stop offset="100%" stop-color="#0b0d14" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowMint" cx="80%" cy="76%" r="50%">
      <stop offset="0%" stop-color="#6fcf97" stop-opacity="0.22"/>
      <stop offset="48%" stop-color="#2b8a6e" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0b0d14" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowViolet" cx="62%" cy="22%" r="42%">
      <stop offset="0%" stop-color="#9d7cd8" stop-opacity="0.18"/>
      <stop offset="55%" stop-color="#4e3d7a" stop-opacity="0.06"/>
