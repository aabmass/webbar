  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glowBlue)"/>
  <rect width="1600" height="900" fill="url(#glowMint)"/>
  <rect width="1600" height="900" fill="url(#glowViolet)"/>

  <!-- Layered translucent waves -->
  <path d="M-40 620 C 260 470, 560 720, 920 560 C 1220 425, 1420 510, 1660 410 L 1660 940 L -40 940 Z" fill="url(#wave1)"/>
  <path d="M-40 730 C 310 610, 620 820, 980 680 C 1280 565, 1460 660, 1660 580 L 1660 940 L -40 940 Z" fill="url(#wave2)"/>

